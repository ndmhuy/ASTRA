name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pip check
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python scripts/check_repository.py
      - run: python -m pytest --cov=exam_baseline --cov-report=term-missing
      - run: python scripts/smoke_server.py
      - run: python scripts/smoke_mas.py
        if: matrix.python == '3.11'
      - run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify MAS from the installed ASTRA wheel
        if: matrix.python == '3.11'
        shell: bash
        run: |
          python -m pip install --force-reinstall --no-deps dist/exam_baseline-*.whl
          python -I scripts/smoke_mas.py
